name: Deploy Hindi Panchang to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare published site under repository subpath
        run: |
          mkdir -p _site
          cp -a dist/. _site/
          python - <<'PY'
          from pathlib import Path
          base="https://yuvraajsingh1155-cloud.github.io/tithi-darshan"
          root=Path("_site")
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".html",".xml",".txt",".js",".css",".json"}:
                  continue
              s=p.read_text(encoding="utf-8")
              s=s.replace("https://tithi-darshan.pages.dev",base)
              s=s.replace('href="/','href="/tithi-darshan/')
              s=s.replace('src="/','src="/tithi-darshan/')
              s=s.replace('content="/','content="/tithi-darshan/')
              if p.suffix.lower()==".js":
                  s=s.replace('"/shehar/', '"/tithi-darshan/shehar/').replace("'/shehar/", "'/tithi-darshan/shehar/")
                  s=s.replace('"/panchang/', '"/tithi-darshan/panchang/').replace("'/panchang/", "'/tithi-darshan/panchang/")
              p.write_text(s,encoding="utf-8")
          (root/".nojekyll").touch()
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
