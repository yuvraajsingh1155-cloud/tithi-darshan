name: Production Tithi Freshness Watch
on:
  workflow_dispatch:
  schedule:
    # Four independent freshness checks/day, with corrective build dispatch.
    - cron: '40 1,7,13,19 * * *'
permissions:
  contents: read
  actions: write
jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify public homepage and latest Indian date
        id: freshness
        continue-on-error: true
        run: python scripts/check_public_freshness.py
      - name: Request fresh generation when public date check failed
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Production date stale. Triggering verified rebuild."
          gh api -X POST "repos/$GH_REPOSITORY/actions/workflows/daily-panchang.yml/dispatches" -f ref=main
      - name: Record monitoring failure in Actions
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "::error::Production homepage freshness failed. A new build was requested."
          exit 1
