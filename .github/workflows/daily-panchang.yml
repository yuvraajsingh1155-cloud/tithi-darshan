name: Daily Hindi Panchang Publish
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'templates/**'
      - 'data/**'
      - 'assets/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    # 00:17 IST daily (previous UTC day); GitHub cron may run late.
    - cron: '47 18 * * *'
    # Backup after Indian sunrise; helpful if first job was delayed.
    - cron: '17 2 * * *'
permissions:
  contents: write
concurrency:
  group: daily-panchang
  # Prevent dozens of obsolete builds competing with the latest source.
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild public static files in Indian time
        env:
          SITE_URL: https://hindu-tithi-darshan.pages.dev
        run: python scripts/build.py
      - name: Validate public JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/shell.js
          node --check assets/dashboard.js
          node --check assets/freshness.js
          node --check assets/global-search.js
          node --check assets/preferences.js
          node --check assets/calendar.js
          node --check assets/ekadashi.js
          node --check assets/bookmarks.js
          node --check assets/settings.js
          node --check assets/auth.js
          node --check assets/ashtakoota-full.js
          node --check assets/koota-preview.js
          node --check assets/rashifal.js
          node tests/test_koota_preview.cjs
      - name: Check Supabase Google OAuth provider state (nonblocking)
        run: python scripts/check_google_oauth.py
      - name: Verify private Kundli API rejects anonymous access
        run: python scripts/check_kundli_gate.py
      - name: Verify published pages and links
        run: |
          python -m pip install --disable-pip-version-check -q pytest beautifulsoup4
          python -m pytest -q

      - name: Commit updated Panchang pages (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Repository changed during build: regenerate on the latest main."
              git reset --hard origin/main
              SITE_URL=https://hindu-tithi-darshan.pages.dev python scripts/build.py
            fi
            git add dist
            if git diff --cached --quiet; then
              echo "No content changed."
              published=true
              break
            fi
            git commit -m "chore: refresh Hindi Panchang for India"
            if git push origin HEAD:main; then
              echo "Published generated pages."
              published=true
              break
            fi
            echo "Concurrent push rejected, refreshing source and rebuilding."
          done
          if [ "$published" != true ]; then
            echo "Failed to publish after three safe attempts." >&2
            exit 1
          fi

      - name: Trigger Cloudflare Pages deploy hook when configured
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare rebuild requested."
          else
            echo "No Cloudflare deploy hook configured; using Git integration."
          fi
