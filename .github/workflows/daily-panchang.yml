name: Daily Hindi Panchang Publish
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'templates/**'
      - 'data/**'
      - 'assets/**'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    # 00:17 IST daily (previous UTC day); GitHub cron may run late.
    - cron: '47 18 * * *'
    # Backup after Indian sunrise; helpful if first job was delayed.
    - cron: '17 2 * * *'
permissions:
  contents: write
concurrency:
  group: daily-panchang
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild public static files in Indian time
        env:
          SITE_URL: https://hindu-tithi-darshan.pages.dev
        run: python scripts/build.py
      - name: Commit updated Panchang pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Hindi Panchang for India"
            git push
          else
            echo "No content changed."
          fi

      - name: Trigger Cloudflare Pages deploy hook when configured
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$CLOUDFLARE_DEPLOY_HOOK"
            echo "Cloudflare rebuild requested."
          else
            echo "No Cloudflare deploy hook configured; using Git integration."
          fi
