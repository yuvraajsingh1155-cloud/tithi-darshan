name: Premium Website Browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/browser_smoke.py'
      - '.github/workflows/premium-browser-qa.yml'
      - 'templates/panchang.html'
      - 'templates/search.html'
      - 'assets/freshness.js'
      - 'assets/global-search.js'
      - 'assets/premium.css'
      - 'assets/visual-v3.css'
      - 'assets/shell.js'
      - 'assets/dashboard.js'
      - 'assets/td-icons.svg'
      - 'assets/brand-mark.svg'
      - 'templates/base.html'
      - 'templates/account.html'
      - 'templates/settings.html'
      - 'templates/deities.html'
      - 'templates/deity-detail.html'
      - 'tests/visual_qa_v3.py'
      - 'data/deity_details.json'
permissions:
  contents: read
jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt playwright
      - name: Install test Chromium
        run: python -m playwright install --with-deps chromium
      - name: Generate website locally
        env:
          SITE_URL: https://hindu-tithi-darshan.pages.dev
        run: python scripts/build.py
      - name: Run 8 breakpoint tests and settings QA
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/tithi-http.log 2>&1 &
          python tests/browser_smoke.py
          python tests/visual_qa_v3.py
      - name: Preserve public-page screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tithi-2-visual-qa
          path: artifacts/tithi-2-visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve Premium Visual V3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tithi-premium-v3-screenshots
          path: artifacts/visual-v3/*.png
          if-no-files-found: ignore
          retention-days: 30
