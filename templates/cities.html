{% extends 'base.html' %}
{% block content %}<div class="subhero"><div class="shell"><span class="kicker">स्थान आधारित पंचांग</span><h1>अपना शहर चुनें</h1><p>सूर्योदय, सूर्यास्त और दैनिक मुहूर्त स्थानीय निर्देशांकों पर आधारित होते हैं। आज का पंचांग देखने के लिए अपना शहर चुनें।</p></div></div><section class="shell content-section"><div class="all-city-grid">{% for city in cities %}<a class="all-city-card" href="/shehar/{{ city.slug }}/"><span class="pin">⌖</span><span><strong>{{ city.name }}</strong><small>{{ city.english }} · भारत</small></span><span class="arrow">↗</span></a>{% endfor %}</div></section>{% endblock %}
